default:
  interruptible: true
  artifacts:
    expire_in: 2 weeks
    when: always
    paths:
    - "*.tar.gz"
    - ./*.log
    - ./config.h
    - ./**/*.log
    - website/html
    - coverage
    - clang-analyzer

stages:
 - build
 - test
 - deploy

B-gcc:
  image: gcc:latest
  stage: build
  before_script:
  - gcc --version
  - apt-get update -qq
  - apt-get install -y -qq make git autoconf automake libtool bison libpam0g-dev libxmlsec1-dev libxml2-utils help2man gtk-doc-tools gengetopt
  script:
  - gcc --version
  - ./bootstrap
  - ./configure CC="gcc -std=gnu2x" --enable-gcc-warnings WARN_CFLAGS=-Werror
  - make -j$(nproc) V=1
  - make -j$(nproc) V=1 check VERBOSE=t
  - git status
  - git diff --exit-code

B-clang:
  image: silkeh/clang:latest
  stage: build
  before_script:
  - clang --version
  - apt-get update -qq
  - apt-get install -y -qq make git autoconf automake libtool bison libpam0g-dev libxmlsec1-dev libxml2-utils help2man gtk-doc-tools gengetopt
  script:
  - clang --version
  - ./bootstrap
  - ./configure CC="clang -std=gnu2x" --enable-gcc-warnings WARN_CFLAGS=-Werror
  - make -j$(nproc) V=1
  - make -j$(nproc) V=1 check VERBOSE=t
  - git status
  - git diff --exit-code

B-Trisquel11:
  image: registry.gitlab.com/oath-toolkit/build-images:Trisquel11
  stage: build
  before_script:
  - apt-get remove -y -qq --purge indent
  script:
  - echo "--suppressions=$(pwd)/libpskc/tests/libpskc.supp" >> ~/.valgrindrc
  - ./bootstrap
  - ./configure --enable-gtk-doc --enable-gtk-doc-pdf --enable-gcc-warnings --enable-root-tests --enable-valgrind-tests
  - make -j$(nproc) syntax-check
  - make -j$(nproc) V=1
  - make -j$(nproc) V=1 check VERBOSE=t
  - make -j$(nproc) dist
  - sha224sum oath-toolkit-*.tar.gz
  - cd website && ./build-website.sh

B-Debian12-coverage:
  image: registry.gitlab.com/oath-toolkit/build-images:Debian12-coverage
  stage: build
  script:
  - echo "--suppressions=$(pwd)/libpskc/tests/libpskc.supp" >> ~/.valgrindrc
  - ./bootstrap
  - ./configure --enable-gcc-warnings --enable-root-tests --enable-valgrind-tests CFLAGS="-g --coverage"
  - lcov --directory . --zerocounters
  - make -j$(nproc) check V=1 VERBOSE=t
  - grep '^PASS tst_usersfile.sh' liboath/tests/tst_usersfile.log
  - grep '^PASS run-root-tests.sh' pam_oath/tests/run-root-tests.sh.log
  - mkdir coverage
  - lcov --directory . --output-file coverage/oath-toolkit.info --capture
  - lcov --remove coverage/oath-toolkit.info '/usr/include/*' '*/liboath/gl/*' '*/liboath/tests/*' '*/libpskc/gl/*' '*/libpskc/tests/*' '*/oathtool/gl/*' '*/pam_oath/tests/*' '*/pskctool/gl/*' -o coverage/oath-toolkit_filtered.info
  - genhtml --output-directory coverage coverage/oath-toolkit_filtered.info --highlight --frames --legend --title "OATH Toolkit"

B-Fedora39-clanganalyzer:
  image: registry.gitlab.com/oath-toolkit/build-images:Fedora39-clanganalyzer
  stage: build
  script:
  - ./bootstrap
  - scan-build ./configure --with-xmlsec-crypto-engine=openssl
  - scan-build -o clang-analyzer make -j$(nproc) V=1

# https://docs.gitlab.com/ee/ci/runners/saas/macos/environment.html
B-macOS14Xcode15:
  when: manual
  image: macos-14-xcode-15
  tags: [ saas-macos-medium-m1 ]
  stage: build
  variables:
    HOMEBREW_NO_AUTO_UPDATE: 1
    HOMEBREW_NO_INSTALL_UPGRADE: 1
    HOMEBREW_NO_INSTALL_CLEANUP: 1
    HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  before_script:
  - brew install autoconf automake libtool gengetopt bison gtk-doc help2man libxmlsec1
  script:
  - PATH="/opt/homebrew/opt/bison/bin:$PATH" # brew bison is keg-only
  - ./bootstrap
  - ./configure --enable-gcc-warnings
  - make -j$(nproc) syntax-check
  - make -j$(nproc) V=1
  - make -j$(nproc) V=1 -k check VERBOSE=t
  - git status
  - git diff --exit-code

# https://docs.gitlab.com/ee/ci/runners/saas/windows_saas_runner.html
B-Windows-UCRT64:
  when: manual
  tags: [ shared-windows, windows-1809 ]
  stage: build
  script: # https://www.msys2.org/docs/ci/#other-systems
  - wget.exe -nv -O msys2.exe https://github.com/msys2/msys2-installer/releases/download/nightly-x86_64/msys2-base-x86_64-latest.sfx.exe
  - ./msys2.exe -y -oC:\
  - Remove-Item msys2.exe
  - $env:CHERE_INVOKING = 'yes'
  - $env:MSYSTEM = 'UCRT64' # https://www.msys2.org/docs/environments/
  - C:\msys64\usr\bin\bash -lc ' '
  - C:\msys64\usr\bin\bash -lc 'pacman --noconfirm -Syuu'
  - C:\msys64\usr\bin\bash -lc 'pacman --noconfirm -Syuu'
  - |
    C:\msys64\usr\bin\bash -lc '
    pacman --noconfirm -Syu git autoconf automake libtool make mingw-w64-ucrt-x86_64-gcc bison gtk-doc gengetopt help2man
    # https://docs.github.com/en/get-started/getting-started-with-git/configuring-git-to-handle-line-endings
    file configure.ac
    git config --global core.autocrlf false
    git config --global core.eol lf
    git rm -rf --cached . | tail
    git reset --hard HEAD
    file configure.ac
    ./bootstrap
    ./configure --enable-gcc-warnings
    make -j$(nproc) V=1 -k check VERBOSE=t'

Windows-MSYS:
  when: manual
  tags: [ shared-windows, windows-1809 ]
  stage: test
  needs: [B-Trisquel11]
  script: # https://www.msys2.org/docs/ci/#other-systems
  - wget.exe -nv -O msys2.exe https://github.com/msys2/msys2-installer/releases/download/nightly-x86_64/msys2-base-x86_64-latest.sfx.exe
  - ./msys2.exe -y -oC:\
  - Remove-Item msys2.exe
  - $env:CHERE_INVOKING = 'yes'
  - $env:MSYSTEM = 'MSYS' # https://www.msys2.org/docs/environments/
  - C:\msys64\usr\bin\bash -lc ' '
  - C:\msys64\usr\bin\bash -lc 'pacman --noconfirm -Syuu'
  - C:\msys64\usr\bin\bash -lc 'pacman --noconfirm -Syuu'
  - |
    C:\msys64\usr\bin\bash -lcx '
    pacman --noconfirm -Syu make gcc
    tar xfa oath-toolkit-*.tar.gz
    cd `ls -d oath-toolkit-* | grep -v tar.gz`
    ./configure --enable-gcc-warnings
    make -j$(nproc) V=1 -k check VERBOSE=t'

Windows-MINGW64:
  when: manual
  tags: [ shared-windows, windows-1809 ]
  stage: test
  needs: [B-Trisquel11]
  script: # https://www.msys2.org/docs/ci/#other-systems
  - wget.exe -nv -O msys2.exe https://github.com/msys2/msys2-installer/releases/download/nightly-x86_64/msys2-base-x86_64-latest.sfx.exe
  - ./msys2.exe -y -oC:\
  - Remove-Item msys2.exe
  - $env:CHERE_INVOKING = 'yes'
  - $env:MSYSTEM = 'MINGW64' # https://www.msys2.org/docs/environments/
  - C:\msys64\usr\bin\bash -lc ' '
  - C:\msys64\usr\bin\bash -lc 'pacman --noconfirm -Syuu'
  - C:\msys64\usr\bin\bash -lc 'pacman --noconfirm -Syuu'
  - |
    C:\msys64\usr\bin\bash -lcx '
    pacman --noconfirm -Syu make mingw-w64-x86_64-gcc
    tar xfa oath-toolkit-*.tar.gz
    cd `ls -d oath-toolkit-* | grep -v tar.gz`
    ./configure --enable-gcc-warnings
    make -j$(nproc) V=1 -k check VERBOSE=t'

Debian12:
  image: debian:12-slim
  stage: test
  needs: [B-Trisquel11]
  before_script:
  - apt-get update -qq
  - apt-get install -y -qq make gcc pkg-config libpam0g-dev libxmlsec1-dev libxml2-utils datefudge
  script:
  - tar xfa oath-toolkit-*.tar.gz
  - cd `ls -d oath-toolkit-* | grep -v tar.gz`
  - mkdir b
  - cd b
  - ../configure --enable-gcc-warnings --disable-valgrind-tests
  - make -j$(nproc) check V=1 VERBOSE=t

Ubuntu-xmlsec:
  image: ubuntu:20.04
  stage: test
  needs: [B-Trisquel11]
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
  - apt-get update -qq
  - apt-get install -y -qq make gcc pkg-config libpam0g-dev libxmlsec1-dev libxml2-utils datefudge
  script:
  - tar xfa oath-toolkit-*.tar.gz
  - cd `ls -d oath-toolkit-* | grep -v tar.gz`
  - mkdir b
  - cd b
  - ../configure --enable-gcc-warnings --disable-valgrind-tests
  - make -j$(nproc) check V=1 VERBOSE=t

AlmaLinux8:
  image: almalinux:8
  stage: test
  needs: [B-Trisquel11]
  before_script:
  - yum -y install make gcc diffutils file pam-devel
  - dnf -y install epel-release
  - dnf --enablerepo=powertools -y install indent
  script:
  - tar xfa oath-toolkit-*.tar.gz
  - cd `ls -d oath-toolkit-* | grep -v tar.gz`
  - ./configure --disable-pskc --enable-gcc-warnings --disable-valgrind-tests
  - make -j$(nproc) syntax-check
  - make -j$(nproc) check V=1 VERBOSE=t

AlmaLinux8-xmlsec:
  image: almalinux:8
  stage: test
  needs: [B-Trisquel11]
  before_script:
  - yum -y install make gcc diffutils file pam-devel
  - yum -y install libxml2-devel libtool-ltdl-devel
  - dnf -y install epel-release
  - dnf -y --enablerepo=powertools install xmlsec1-openssl-devel
  script:
  - tar xfa oath-toolkit-*.tar.gz
  - cd `ls -d oath-toolkit-* | grep -v tar.gz`
  - ./configure --enable-gcc-warnings --disable-valgrind-tests --with-xmlsec-crypto-engine=openssl
  - make -j$(nproc) check V=1 VERBOSE=t

Alpine:
  image: alpine:latest
  stage: test
  needs: [B-Trisquel11]
  before_script:
  - apk update
  - apk add build-base datefudge
  script:
  - tar xfz oath-toolkit-*.tar.gz
  - cd `ls -d oath-toolkit-* | grep -v tar.gz`
  - ./configure --disable-pskc --enable-gcc-warnings
  - make -j$(nproc) check V=1 VERBOSE=t

ArchLinux:
  image: archlinux:latest
  stage: test
  needs: [B-Trisquel11]
  before_script:
  - pacman -Suy --noconfirm make gcc diffutils file
  script:
  - tar xfz oath-toolkit-*.tar.gz
  - cd `ls -d oath-toolkit-* | grep -v tar.gz`
  - mkdir b
  - cd b
  - ../configure --disable-pskc --enable-gcc-warnings
  - make -j$(nproc) check V=1 VERBOSE=t

ArchLinux-xmlsec:
  image: archlinux:latest
  stage: test
  needs: [B-Trisquel11]
  before_script:
  - pacman -Suy --noconfirm make gcc diffutils file xmlsec pkg-config
  script:
  - tar xfz oath-toolkit-*.tar.gz
  - cd `ls -d oath-toolkit-* | grep -v tar.gz`
  - mkdir b
  - cd b
  - ../configure --enable-gcc-warnings
  - make -j$(nproc) check V=1 VERBOSE=t

Gentoo:
  image: registry.gitlab.com/oath-toolkit/build-images:Gentoo
  stage: test
  needs: [B-Trisquel11]
  script:
  - tar xfz oath-toolkit-*.tar.gz
  - cd `ls -d oath-toolkit-* | grep -v tar.gz`
  - mkdir b
  - cd b
  - ../configure --enable-gcc-warnings
  - make -j$(nproc) check V=1 VERBOSE=t

macOS13Xcode14:
  when: manual
  image: macos-13-xcode-14
  tags: [ saas-macos-medium-m1 ]
  stage: test
  needs: [B-Trisquel11]
  variables:
    HOMEBREW_NO_AUTO_UPDATE: 1
    HOMEBREW_NO_INSTALL_UPGRADE: 1
    HOMEBREW_NO_INSTALL_CLEANUP: 1
    HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  before_script:
  - brew install libxmlsec1
  script:
  - gzip -cd oath-toolkit-*.tar.gz | tar xf -
  - cd `ls -d oath-toolkit-* | grep -v tar.gz`
  - mkdir b
  - cd b
  - ../configure --enable-gcc-warnings
  - make -j$(nproc) syntax-check
  - make -j$(nproc) V=1 check VERBOSE=t

Mingw32:
  image: debian:11-slim
  stage: test
  needs: [B-Trisquel11]
  before_script:
  - dpkg --add-architecture i386
  - apt-get update -qq
  - apt-get install -y -qq make mingw-w64 wine wine32 wine64 libwine libwine:i386 binfmt-support wine-binfmt
  - update-binfmts --enable wine
  script:
  - tar xfa oath-toolkit-*.tar.gz
  - cd `ls -d oath-toolkit-* | grep -v tar.gz`
  - ./configure --host=i686-w64-mingw32 CC='i686-w64-mingw32-gcc -static-libgcc'
  - make -j$(nproc) V=1
  - make -j$(nproc) -C liboath/tests check VERBOSE=t
  - make -j$(nproc) -C oathtool/tests check VERBOSE=t

Mingw64:
  image: debian:11-slim
  stage: test
  needs: [B-Trisquel11]
  before_script:
  - apt-get update -qq
  - apt-get install -y -qq make mingw-w64 wine wine64 binfmt-support wine-binfmt
  - update-binfmts --enable wine
  script:
  - tar xfa oath-toolkit-*.tar.gz
  - cd `ls -d oath-toolkit-* | grep -v tar.gz`
  - ./configure --host=x86_64-w64-mingw32
  - make -j$(nproc) V=1
  - make -j$(nproc) -C liboath/tests check VERBOSE=t
  - make -j$(nproc) -C oathtool/tests check VERBOSE=T

.pages:
  stage: deploy
  needs: ["B-Trisquel11", "B-Debian12-coverage", "B-Fedora39-clanganalyzer"]
  script:
  - mkdir public
  - mv coverage/ public/
  - mv clang-analyzer/* public/clang-analyzer
  - mv website/html/* public/
  artifacts:
    paths:
    - public
    expire_in: 30 days

pages:
  extends: .pages
  only:
  - master

pages-test:
  extends: .pages
  except:
  - master
