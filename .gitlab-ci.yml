.pages:
  stage: deploy
  needs: ["B-Trisquel11", "B-Debian12-coverage", "B-Fedora39-clanganalyzer"]
  script:
  - mkdir public
  - mv coverage/ public/
  - mv clang-analyzer/* public/clang-analyzer
  - mv website/html/* public/
  artifacts:
    paths:
    - public
    expire_in: 30 days

pages:
  extends: .pages
  rules:
  - if: $CI_COMMIT_REF_PROTECTED == "true"

pages-test:
  extends: .pages
  rules:
  - if: $CI_COMMIT_REF_PROTECTED != "true"
